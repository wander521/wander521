name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity.yml'
      - 'tools/activity.py'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Generate from public contributions
        run: python3 tools/activity.py
      - name: Commit activity assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-*.svg assets/activity-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
