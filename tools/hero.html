<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/font/400.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:480px;overflow:hidden;background:#110f0d;color:#f6ecdf}body{font-family:Georgia,'Noto Serif SC',serif}.name{position:absolute;left:56px;top:43px;margin:0;font-size:27px;font-weight:400;letter-spacing:.01em;z-index:2}.name span{font-family:'Noto Serif SC',serif;font-size:20px;color:#bdb09f;margin-left:18px}.message{position:absolute;left:52px;top:125px;margin:0;font-size:70px;font-weight:400;line-height:1.08;letter-spacing:-.025em;z-index:2}.role{position:absolute;left:56px;top:310px;font:18px -apple-system,BlinkMacSystemFont,sans-serif;color:#bdb09f;z-index:2}.robot-video{position:absolute;left:515px;top:-95px;width:720px;height:645px;object-fit:fill;mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 93%,transparent 100%)}.flow{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;border-top:1px solid #504234;padding:0 56px;background:#110f0d;z-index:3}.step{flex:1;display:flex;gap:11px;align-items:center;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#bdb09f}.dot{width:6px;height:6px;border-radius:50%;background:#948470}.step.active{color:#f6ecdf}.step.active .dot{background:#d8a56b}.step::after{content:'';display:block;width:64px;height:1px;background:#504234;margin-left:16px}.step:nth-child(4)::after{display:none}.packet{position:absolute;bottom:12px;width:28px;height:2px;background:#d8a56b;opacity:0}
</style></head><body>
<img class="robot-video" src="/tools/source-frames/001.png" alt="Close-up of the silver robot">
<p class="name">WANG BO<span>汪博</span></p><h1 class="message">From intent<br>to action.</h1><p class="role">AI Agents / Embodied Intelligence</p>
<div class="flow"><span class="step"><i class="dot"></i>Interaction</span><span class="step"><i class="dot"></i>Agent orchestration</span><span class="step"><i class="dot"></i>Skills &amp; tools</span><span class="step"><i class="dot"></i>Robot execution</span><i class="packet"></i></div>
<script>
const robot=document.querySelector('.robot-video');
window.renderFrame=async phase=>{const index=Math.min(63,Math.round((phase<.5?phase*2:(1-phase)*2)*63))+1;robot.src='/tools/source-frames/'+String(index).padStart(3,'0')+'.png';await robot.decode();const selected=Math.floor(phase*4)%4;document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===selected));const packet=document.querySelector('.packet');packet.style.left=(56+phase*1030)+'px';packet.style.opacity=String(Math.sin(phase*Math.PI)*.9)};
(async()=>{await document.fonts.ready;await window.renderFrame(.32);window.ready=true})();
</script></body></html>
